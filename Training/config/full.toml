# Full-run config template for Training/train.py (turnip-ml#13).
# Copy to Training/config/full.local.toml (git-ignored scratch) and point it
# at a real export: manifest.jsonl from the farm, split.json from
# split_dataset.py. Runs on the droplet during MVP; set compute = "gpu" on
# the GPU worker. See Training/README.md "Full run".
seed = 0

compute = "cpu"

# Real data locations (NOT committed): farm export + #12 split output.
split_path = "data/split.json"
samples_dir = "data/samples"
out_dir = "runs/full"

# Segments are a clip plus 0.5 s (5 frames) of context each side
# (TRAINING_DESIGN.md §2.5): a window must be shorter than 10 frames for one
# lying mostly in context, a background window, to exist at all.
# *(Judgment call on 8 / 4.)*
window_frames = 8
window_stride = 4

learning_rate = 0.1
epochs = 500
l2 = 0.0001

# Class balance (TRAINING_DESIGN.md §2.7): each epoch's windows are sampled
# with weight ∝ count**-class_balance_exponent per canonical name — a combo
# window takes its rarest name's weight — and background windows are sampled
# separately at background_ratio of the epoch sample (§2.5).
class_balance_exponent = 0.5
background_ratio = 0.2
# Background margin (TRAINING_DESIGN.md §2.5): windows within this many
# seconds of a labeled segment are excluded from the background pool. 0 for
# segments: every context frame is within 0.5 s of the clip, so any margin
# would leave no background at all.
background_margin_seconds = 0.0

# Fine-tune the current champion instead of training from scratch:
# init_checkpoint = "runs/champion/model.npz"
init_checkpoint = ""
