# Training pipeline: the nightly trick-model run (docs/TRAINING_DESIGN.md §5).
#
# The only workflow that touches real data or secrets, so it never runs on
# pull_request: only on the nightly schedule (from main) or by dispatch.
#
# Modes (dispatch input `source`; the schedule always runs `farm`):
#   synthetic  rehearses the chain on the committed smoke fixture and a
#              generated synthetic fixture set, twice: a first run with no
#              champion bootstraps one, a second runs the fixture gate and
#              the promotion gate against it. No secrets; both run
#              directories are uploaded as an artifact (synthetic data
#              only).
#   farm       the real run, from the `training` Environment: count label
#              rows changed since the stored watermark (skip at 50 or
#              fewer unless `force`), full pull + pose blobs, the changed-
#              source list, then the shared chain. Logs and artifacts of
#              this public repository are public, so nothing per-sample is
#              printed or uploaded as an artifact: the run directory goes
#              to the private R2 bucket. A promoted champion (or a
#              re-scored one) is stored back to R2 as a new version, and
#              the gates' decision log with it. The watermark advances
#              only at the end of a successful run without a fixture
#              regression.
#
# Both modes run Training/pipeline.sh: split -> train (fine-tune the
# champion unless `from_scratch`) -> predict holdout -> evaluate holdout
# -> per-name metrics -> fixture runner -> fixture gate -> promotion gate
# -> publish (#16). With no champion yet, nothing is promoted unless a
# dispatch sets `bootstrap_champion`. Only a gated promotion is published
# (never a bootstrap), and only the farm job may publish.
#
# No actions/cache anywhere: pull_request runs can read caches written on
# main, so nothing derived from contributed data may go into one.
name: Training pipeline

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'synthetic (rehearsal on the smoke fixture) or farm (real data)'
        type: choice
        options: [synthetic, farm]
        default: synthetic
      force:
        description: 'farm: run even with 50 or fewer new label rows'
        type: boolean
        default: false
      from_scratch:
        description: 'train from scratch instead of fine-tuning the champion'
        type: boolean
        default: false
      bootstrap_champion:
        description: 'farm, no champion yet: make this run''s challenger the first champion'
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, and never cancel one: a run may already have written
# to R2 when the next is queued.
concurrency:
  group: training-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.source == 'synthetic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOLDOUT_IDS: data/holdout_ids.txt
      SPLIT_RATIOS: '0.5 0.25 0.25'
      FROM_SCRATCH: ${{ inputs.from_scratch || false }}
      FIXTURES: data/fixtures/fixtures.json
      FIXTURE_POSES: data/fixtures/poses
      INGESTED: data/ingested.json
      REGISTRY: data/registry.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training dependencies
        run: pip install -r Training/requirements.txt

      # source-c (smoke-007/008) pinned to holdout; with 50/25/25 targets
      # the seeded split puts source-a in train and source-b in val. The
      # fixture set is synthetic too (make_synthetic_fixtures.py), and no
      # source changed since any watermark.
      - name: Synthetic dataset and fixture set
        run: |
          python Training/make_smoke_fixture.py --out data/dataset --seed 0
          python Training/make_synthetic_fixtures.py --out data/fixtures --seed 0
          echo smoke-008 > data/holdout_ids.txt
          echo '[]' > data/ingested.json

      - name: 'First run: no champion, so bootstrap one'
        env:
          BOOTSTRAP_CHAMPION: 'true'
        run: |
          Training/pipeline.sh
          mv data/run data/run-bootstrap

      # The farm job's store and restore, minus R2: a pointer for the
      # staged slot, then the champion verified against it.
      - name: 'Store and restore that champion'
        run: |
          python Training/champion_slot.py pointer \
            --manifest data/run-bootstrap/champion_update/champion.json \
            --version synthetic-bootstrap --out data/champion-pointer.json
          mkdir -p data/champion
          cp data/run-bootstrap/champion_update/* data/champion/
          python Training/champion_slot.py verify \
            --pointer data/champion-pointer.json --dir data/champion

      - name: 'Second run: fixture gate and promotion against that champion'
        run: Training/pipeline.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-run
          path: |
            data/run-bootstrap
            data/run
            data/registry.json
          retention-days: 7

  farm:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.source == 'farm')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: training
    env:
      TURNIP_FARM_URL: ${{ vars.TURNIP_FARM_URL }}
      TURNIP_PIPELINE_KEY: ${{ secrets.TURNIP_PIPELINE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The fixture gate's regression alert; the gate records an unset one
      # as alert_status "not-configured" and still skips promotion.
      TURNIP_DISCORD_WEBHOOK_URL: ${{ secrets.TURNIP_DISCORD_WEBHOOK_URL }}
      # The aws CLI (preinstalled on the runner) reads R2 state with the
      # same credentials. R2 rejects the CLI's newer default checksums on
      # some versions; "when_required" works with or without that.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$TURNIP_FARM_URL" ]; then
            echo "::notice::The training Environment is not configured (vars.TURNIP_FARM_URL is empty); nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The export set: training plus coremltools for the publish step.
      - if: steps.config.outputs.configured == 'true'
        name: Install training + export dependencies
        run: pip install -r Training/requirements-export.txt

      # training/state/export_state.json  the watermark (never printed: the
      #                                   cursor may embed raw label text)
      # training/champion/current.json    the champion pointer, if any:
      #                                   its version and file hashes
      #   .../versions/<version>/         model.npz (fine-tune base),
      #                                   metrics.json (promotion baseline),
      #                                   fixture_scores.json (fixture gate
      #                                   baseline); verified on restore
      # training/registry.json            the gates' decision log
      # training/holdout_ids.txt          admin-pinned holdout, if any
      # training/fixtures/poses/          the fixture set's pose blobs
      #                                   (verified by the fixture runner)
      - if: steps.config.outputs.configured == 'true'
        name: Restore training state from R2
        run: |
          r2() { aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 "$@"; }
          base="s3://${R2_BUCKET}/training"
          # Fails the job on bad credentials, so "not found" below is real.
          r2 ls "s3://${R2_BUCKET}/" > /dev/null
          mkdir -p data/state data/champion data/run data/fixture-poses
          restore() {  # restore <key under training/> <local path>
            if r2 ls "$base/$1" > /dev/null; then
              r2 cp --only-show-errors "$base/$1" "$2"
              echo "restored training/$1"
            else
              echo "no training/$1 yet"
            fi
          }
          restore state/export_state.json data/state/export_state.json
          if r2 ls "$base/champion/current.json" > /dev/null; then
            r2 cp --only-show-errors "$base/champion/current.json" data/champion-pointer.json
            version=$(python Training/champion_slot.py version data/champion-pointer.json)
            r2 cp --recursive --only-show-errors "$base/champion/versions/$version/" data/champion/
            python Training/champion_slot.py verify \
              --pointer data/champion-pointer.json --dir data/champion
            echo "restored champion version $version"
          elif r2 ls "$base/champion/model.npz" > /dev/null; then
            # Placed by hand before champions were versioned: no hashes to
            # check. The next promotion or re-score stores a versioned one.
            echo "::warning::Unversioned champion (training/champion/model.npz): restored without hash verification."
            restore champion/model.npz data/champion/model.npz
            restore champion/metrics.json data/champion/metrics.json
            restore champion/fixture_scores.json data/champion/fixture_scores.json
          else
            echo "no champion yet"
          fi
          restore registry.json data/registry.json
          restore holdout_ids.txt data/holdout_ids.txt
          if r2 ls "$base/fixtures/poses/" > /dev/null; then
            r2 cp --recursive --only-show-errors "$base/fixtures/poses/" data/fixture-poses/
          fi
          echo "restored $(find data/fixture-poses -type f | wc -l | tr -d ' ') fixture pose blobs"

      - if: steps.config.outputs.configured == 'true'
        name: Count label rows changed since the watermark
        id: count
        run: |
          state=()
          [ -f data/state/export_state.json ] && state=(--state data/state/export_state.json)
          python Training/fetch_dataset.py count "${state[@]}" \
            --out-state data/state/count_state.json > data/count.json
          new=$(python -c 'import json; print(json.load(open("data/count.json"))["new_labels"])')
          echo "new label rows since the watermark: $new"
          if [ "$new" -le 50 ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$new new label rows (50 or fewer): skipping this run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.count.outputs.run == 'true'
        name: Pull the dataset (full pull, pruned blob cache)
        run: |
          python Training/fetch_dataset.py build --out data/dataset --cache data/blob-cache

      # Taken after the dataset pull, so it covers every new row the
      # challenger trains on (TRAINING_DESIGN.md §7): the fixture gate's
      # --ingested (pipeline.sh's default INGESTED). Its cursor becomes the
      # new watermark.
      - if: steps.count.outputs.run == 'true'
        name: List the sources changed since the watermark
        run: |
          state=()
          [ -f data/state/export_state.json ] && state=(--state data/state/export_state.json)
          python Training/fetch_dataset.py count "${state[@]}" \
            --out-state data/state/new_state.json --out-sources data/run/ingested.json

      # PUBLISH: a champion promoted past both gates is published
      # (Training/publish_model.py, with the job's farm and R2 credentials);
      # a bootstrapped one is not.
      - if: steps.count.outputs.run == 'true'
        name: Split, train, evaluate, fixture gate and promotion
        env:
          FROM_SCRATCH: ${{ inputs.from_scratch || false }}
          BOOTSTRAP_CHAMPION: ${{ inputs.bootstrap_champion || false }}
          REGISTRY: data/registry.json
          PUBLISH: 'true'
          TRAINING_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -f data/holdout_ids.txt ]; then export HOLDOUT_IDS=data/holdout_ids.txt; fi
          Training/pipeline.sh

      - if: steps.count.outputs.run == 'true'
        name: Record the run in R2
        run: |
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp --recursive --only-show-errors data/run \
            "s3://${R2_BUCKET}/training/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          echo "recorded training/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"

      # What pipeline.sh staged: the whole slot (a promoted challenger, or
      # the champion with re-scored fixture scores), with its manifest. It
      # goes to a new version first; the pointer, written last, makes it
      # the champion. An upload that fails partway changes nothing.
      - if: steps.count.outputs.run == 'true'
        name: Store the champion update in R2
        run: |
          r2() { aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 "$@"; }
          base="s3://${R2_BUCKET}/training/champion"
          update=data/run/champion_update
          if [ ! -d "$update" ]; then
            echo "champion unchanged"
            exit 0
          fi
          version="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python Training/champion_slot.py pointer --manifest "$update/champion.json" \
            --version "$version" --out data/champion-next.json
          python Training/champion_slot.py verify --pointer data/champion-next.json --dir "$update"
          r2 cp --recursive --only-show-errors "$update" "$base/versions/$version/"
          r2 cp --only-show-errors data/champion-next.json "$base/current.json"
          echo "stored champion version $version"

      - if: steps.count.outputs.run == 'true'
        name: Store the decision log in R2
        run: |
          if [ -f data/registry.json ]; then
            aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              s3 cp --only-show-errors data/registry.json "s3://${R2_BUCKET}/training/registry.json"
            echo "stored training/registry.json"
          fi

      # Held on a fixture regression: nothing sends quarantine.json to the
      # farm yet, so tonight's suspect sources are still in the export, and
      # the next run's changed-source list must still cover them.
      - if: steps.count.outputs.run == 'true'
        name: Advance the watermark
        run: |
          gate=$(python -c 'import json; print(json.load(open("data/run/outcome.json"))["fixture_gate"])')
          if [ "$gate" = regression ]; then
            echo "::warning::Fixture regression: the watermark is held until the suspect sources are quarantined farm-side (data/run/fixture_gate/quarantine.json in this run's R2 record)."
            exit 0
          fi
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp --only-show-errors data/state/new_state.json \
            "s3://${R2_BUCKET}/training/state/export_state.json"
          echo "watermark advanced"
