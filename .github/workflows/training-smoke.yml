# Training smoke test: every PR touching the training pipeline runs the
# champion training script end-to-end on the tiny synthetic fixture, the
# Core ML export of the resulting model (turnip-ml#16), and the Training/
# unit tests (turnip-ml#13), the publish tests among them against a fake
# farm and R2.
#
# Deliberately ubuntu-only and Python-only, mirroring pose-accuracy.yml: it
# must not duplicate the Xcode build, and it must work on fork PRs (plain
# `pull_request`, never `pull_request_target`). The fixture is synthetic and
# committed, so no secrets or downloads are needed.
name: Training smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'Training/**'
      - '.github/workflows/training-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Training/requirements.txt
            Training/requirements-export.txt

      # The export set includes requirements.txt, plus coremltools so the
      # export runs here and its unit tests are not skipped.
      - name: Install training + export dependencies
        run: pip install -r Training/requirements-export.txt

      # End-to-end smoke: the script must run on the fixture and reach 100%
      # val accuracy (the fixture is separable by construction — anything
      # less is a training-pipeline bug). train.py exits non-zero on failure.
      - name: Smoke-train on the synthetic fixture
        run: |
          python Training/train.py \
            --config Training/config/smoke.toml \
            --out "$RUNNER_TEMP/smoke-run"
          python - <<'EOF'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                          "smoke-run", "metrics.json")))
          assert m["val_accuracy"] == 1.0, m
          print(f"smoke OK: val_accuracy={m['val_accuracy']}, "
                f"loss {m['train_loss_initial']:.4f} -> {m['train_loss_final']:.4f}")
          EOF

      # The Core ML export must run on this runner (Ubuntu) and be
      # byte-reproducible: two exports of the smoke model, compared.
      - name: Export the smoke model to Core ML (twice, byte-identical)
        run: |
          for i in 1 2; do
            python Training/export_coreml.py \
              --model "$RUNNER_TEMP/smoke-run/model.npz" \
              --out "$RUNNER_TEMP/export-$i.mlpackage.zip"
          done
          cmp "$RUNNER_TEMP/export-1.mlpackage.zip" "$RUNNER_TEMP/export-2.mlpackage.zip"

      - name: Training unit tests
        run: python -m unittest discover -s Training/tests -t .
