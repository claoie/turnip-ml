# Shared config for the Python tooling (ruff + mypy) used by
# .github/workflows/python-checks.yml. Run the same checks locally with:
#   pip install "ruff==0.16.7" "mypy==2.3.1"
#   ruff check . && ruff format --check . && mypy .
[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# `Training/` is the pipeline directory name the design docs fix; it is run
# as scripts and unittest discovery, never imported by package name.
"Training/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
# Optional third-party deps don't always ship type stubs in every
# environment; check our own code, not its dependencies.
ignore_missing_imports = true
